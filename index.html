/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ts = v => v?.toDate ? v.toDate() : (v ? new Date(v) : null);
const kst = (d, opt) => d ? d.toLocaleString('ko-KR', Object.assign({ timeZone: 'Asia/Seoul' }, opt)) : '';
const md = d => kst(d, { month: 'numeric', day: 'numeric', weekday: 'short' });
function rnd(n, alph) { const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x => alph[x % alph.length]).join(''); }
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const digits = s => String(s || '').replace(/\D/g, '');
const normName = s => String(s || '').replace(/\s+/g, '');
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2200); }
function copyText(text) {
  const done = () => toast('복사했어요');
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { prompt('아래 주소를 복사하세요', text); } ta.remove(); }
}
async function share(title, text, url) {
  if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  copyText(url);
}
function modal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }

function runIntro() {

}

/* ---------- data ---------- */
async function loadMeta() {
  const [s, c] = await Promise.all([getDoc(doc(db, 'settings', 'main')), getDoc(doc(db, 'counters', 'main'))]);
  S = s.exists() ? s.data() : null; C = c.exists() ? c.data() : { total: 0 };
}
function phase(now = new Date()) {
  if (!S) return 'unset';
  if (now < ts(S.nanumStart)) return 'before';
  if (now < ts(S.baeumStart)) return 'nanum';
  if (now < ts(S.openStart)) return 'baeum';
  if (now < ts(S.closeAt)) return 'open';
  return 'closed';
}
const allowed = ph => ({ nanum: ['nanum'], baeum: ['nanum', 'baeum'], open: ['nanum', 'baeum', 'outside'] }[ph] || []);
const seatsLeft = () => Math.max(0, (S?.capacity || 300) - (C?.total || 0));
async function myParticipant() {
  const tok = localStorage.getItem('hm_tok'); if (!tok) return null;
  try { const p = await getDoc(doc(db, 'participants', tok)); return p.exists() ? { tok, ...p.data() } : null; } catch (e) { return null; }
}

  view.innerHTML = `

async function apply() {
  const ph = phase();
  const types = testKey() ? ['nanum', 'baeum', 'outside'] : allowed(ph);
  const me = await myParticipant();
  if (me && me.status === 'active') { location.hash = '#/t/' + me.tok; return; }
  if (!types.length || seatsLeft() <= 0) {
    view.innerHTML = `<div class="wrap"><h2>탑승 수속</h2><div class="card"><p>${ph === 'before' ? '아직 접수 전이에요. 나눔회원 접수는 ' + md(ts(S.nanumStart)) + '에 열려요.' : seatsLeft() <= 0 ? '자리가 모두 찼어요.' : '지금은 신청을 받지 않아요.'}</p></div><a class="btn2" href="#/">초대장으로</a></div>`;
    return;
  }
  const tLabel = {
    nanum: ['나눔회원', '운영진이 알려 준 숫자 4자리 코드가 필요해요'],
    baeum: ['배움회원', '지딜 단톡방에 있는 회원'],
    outside: ['지딜 회원이 아니에요', '처음 오시는 선생님도 환영해요']
  };
  view.innerHTML = `
  <div class="wrap">
    <h2>탑승 수속</h2>
    <div class="sub">한마당 참가 신청이에요. 3분이면 끝나요.</div>
    ${testBanner()}
    <form id="f" novalidate>
      <div class="field"><label>회원 구분</label><div class="types">
        ${['nanum', 'baeum', 'outside'].map(t => `<label class="${types.includes(t) ? '' : 'dis'}"><input type="radio" name="type" value="${t}" ${types.includes(t) ? '' : 'disabled'} ${types[0] === t && types.length === 1 ? 'checked' : ''}><span>${tLabel[t][0]}<small>${types.includes(t) ? tLabel[t][1] : (t === 'baeum' ? md(ts(S.baeumStart)) + '부터' : md(ts(S.openStart)) + '부터')}</small></span></label>`).join('')}
      </div></div>
      <div class="field" id="codeF" style="display:none"><label>나눔회원 코드 (숫자 4자리)</label><input type="password" id="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="● ● ● ●"></div>
      <div class="field"><label>이름</label><input type="text" id="name" maxlength="30" autocomplete="name" placeholder="김지딜"></div>
      <div class="field"><label>소속 학교 (기관)</label><input type="text" id="school" maxlength="60" placeholder="○○고등학교"></div>
      <div class="field"><label>휴대폰 번호</label><input type="tel" id="phone" inputmode="numeric" maxlength="13" autocomplete="tel" placeholder="01012345678"><div class="hint">안내, 여권 찾기, 신청 취소 확인에 써요</div></div>
      <div class="field"><label>이메일 (선택)</label><input type="email" id="email" maxlength="80" autocomplete="email" placeholder="안내를 메일로도 받고 싶다면"></div>
      <div class="consent">
        <b>개인정보 수집·이용 동의 (필수)</b><br>
        · 목적: 한마당 참가 신청 확인, 행사 안내, 당일 등록과 디지털 여권 운영<br>
        · 항목: 이름, 소속 학교(기관), 휴대폰 번호, 이메일(선택)<br>
        · 보유 기간: ${esc(S?.retention || '행사 종료 후 30일 이내 파기')}<br>
        · 동의하지 않을 수 있으며, 동의하지 않으면 참가 신청을 할 수 없어요.
        <label class="chk"><input type="checkbox" id="consent"> 동의해요</label>
      </div>
      <div class="consent">
        <b>사진 촬영 안내</b><br>행사 기록을 위해 사진과 영상을 찍고 G-DEAL 홈페이지와 SNS에 올릴 수 있어요. 원하지 않으면 당일 등록 데스크에 말씀해 주세요.
        <label class="chk"><input type="checkbox" id="photo"> 확인했어요</label>
      </div>
      <div class="err" id="err"></div>
      <button class="btn" id="go" type="submit">탑승권 발권하기</button>
    </form>
  </div>`;
  const f = $('#f');
  const syncCode = () => { const t = f.querySelector('input[name=type]:checked')?.value; $('#codeF').style.display = t === 'nanum' ? 'block' : 'none'; };
  f.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', syncCode)); syncCode();
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#err'); err.style.display = 'none';
    const fail = m => { err.textContent = m; err.style.display = 'block'; err.scrollIntoView({ block: 'center', behavior: 'smooth' }); $('#go').disabled = false; $('#go').textContent = '탑승권 발권하기'; };
    const type = f.querySelector('input[name=type]:checked')?.value;
    const name = $('#name').value.trim(), school = $('#school').value.trim(), phone = digits($('#phone').value), email = $('#email').value.trim(), code = digits($('#code').value);
    if (!type) return fail('회원 구분을 골라 주세요.');
    if (type === 'nanum' && code.length !== 4) return fail('나눔회원 코드 4자리를 넣어 주세요.');
    if (!name) return fail('이름을 넣어 주세요.');
    if (!school) return fail('소속 학교(기관)를 넣어 주세요.');
    if (!/^01\d{8,9}$/.test(phone)) return fail('휴대폰 번호를 숫자로 정확히 넣어 주세요.');
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('이메일 주소를 확인해 주세요.');
    if (!$('#consent').checked) return fail('개인정보 수집·이용에 동의해야 신청할 수 있어요.');
    if (!$('#photo').checked) return fail('사진 촬영 안내를 확인해 주세요.');
    $('#go').disabled = true; $('#go').textContent = '발권 중…';
    try {
      const phoneKey = await sha('ph|' + phone);
      const lookupKey = await sha('lk|' + normName(name) + '|' + phone);
      const prev = await getDoc(doc(db, 'lookups', lookupKey));
      if (prev.exists()) {
        const pp = await getDoc(doc(db, 'participants', prev.data().tok));
        if (pp.exists() && pp.data().status === 'active') { localStorage.setItem('hm_tok', prev.data().tok); fail('이미 신청했어요. 탑승권으로 이동할게요.'); setTimeout(() => location.hash = '#/t/' + prev.data().tok, 1200); return; }
      }
      const tok = rnd(24, AL);
      const pno = 'GD-' + rnd(5, 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');
      const data = { pno, name, school, phone, type, status: 'active', createdAt: serverTimestamp(), consent: true, photoAck: true, phoneKey, lookupKey };
      if (email) data.email = email;
      if (type === 'nanum') data.code = code;
      if (testKey()) { data.test = true; data.testKey = testKey(); }
      await runTransaction(db, async tx => {
        const cRef = doc(db, 'counters', 'main');
        const c = await tx.get(cRef);
        const cd = c.data();
        if (cd.total >= (S.capacity || 300)) throw new Error('FULL');
        const lRef = doc(db, 'lookups', lookupKey);
        await tx.get(lRef);
        tx.set(doc(db, 'participants', tok), data);
        tx.update(cRef, { total: cd.total + 1, [type]: (cd[type] || 0) + 1, last: tok });
        tx.set(doc(db, 'phones', phoneKey), { tok });
        tx.set(lRef, { tok });
      });
      localStorage.setItem('hm_tok', tok);
      sessionStorage.setItem('hm_new', '1');
      location.hash = '#/t/' + tok;
    } catch (e2) {
      console.error(e2);
      if (e2.message === 'FULL') return fail('방금 자리가 모두 찼어요.');

// 해커톤 취소 쓰기 (트랜잭션 안에서, 읽기는 미리)
async function hackReads(tx, tok) {
  const hRef = doc(db, 'hackers', tok), hcRef = doc(db, 'hcounters', 'main');
  const h = await tx.get(hRef); if (!h.exists() || h.data().status !== 'active') return null;
  const hc = (await tx.get(hcRef)).data();
  let tRef = null, t = null;
  if (h.data().team) { tRef = doc(db, 'teams', h.data().team); const s = await tx.get(tRef); t = s.exists() ? s.data() : null; }
  return { hRef, hcRef, h: h.data(), hc, tRef, t };
}
function hackWrites(tx, tok, r, phone) {
  const v = rnd(20, AL);
  tx.update(r.hRef, { status: 'cancelled', cancelledAt: serverTimestamp(), cancelPhone: phone, v });
  tx.update(r.hcRef, { total: r.hc.total - 1, last: tok });
  if (r.tRef && r.t) { tx.set(doc(db, 'hjoins', v), { tok, team: r.h.team, kind: 'leave' }); tx.update(r.tRef, { count: r.t.count - 1, names: r.t.names.filter(n => n !== r.h.name), v }); }
}
function hackCancelFlow(tok, d) {
  modal(`<h2>해커톤 신청을 취소할까요?</h2><div class="sub">한마당 참가는 그대로 유지돼요. 확인을 위해 휴대폰 번호 전체를 넣어 주세요.</div>

}

function cancelFlow(tok, d) {
  modal(`<h2>참가를 취소할까요?</h2><div class="sub">취소하면 자리가 다른 선생님께 돌아가요. 해커톤을 신청했다면 그것도 함께 취소돼요. 확인을 위해 신청한 휴대폰 번호 전체를 넣어 주세요.</div>
    <div class="field"><input type="tel" id="cxp" inputmode="numeric" placeholder="01012345678"></div><div class="err" id="cxe"></div>
    <button class="btn" id="cxgo" style="background:var(--red)">참가 취소하기</button><div class="gap"></div><button class="btn2" id="cxno">그대로 둘게요</button>`);
  $('#cxno').onclick = closeModal;
  $('#cxgo').onclick = async () => {
    const ph = digits($('#cxp').value);
    const e = $('#cxe'); e.style.display = 'none';
    if (ph !== d.phone) { e.textContent = '신청한 휴대폰 번호와 달라요.'; e.style.display = 'block'; return; }
    $('#cxgo').disabled = true;
    try {
      await runTransaction(db, async tx => {
        const cRef = doc(db, 'counters', 'main'); const pRef = doc(db, 'participants', tok);
        const c = await tx.get(cRef); const p = await tx.get(pRef);
        const hr = await hackReads(tx, tok);
        if (p.data().status !== 'active') throw new Error('ALREADY');
        const cd = c.data(), t = p.data().type;
        if (hr) hackWrites(tx, tok, hr, ph);
        tx.update(pRef, { status: 'cancelled', cancelledAt: serverTimestamp(), cancelPhone: ph });
        tx.update(cRef, { total: cd.total - 1, [t]: (cd[t] || 1) - 1, last: tok });
        tx.delete(doc(db, 'phones', p.data().phoneKey));
      });
      closeModal(); toast('취소했어요'); await loadMeta(); ticket(tok);
    } catch (err) { console.error(err); e.textContent = '취소가 안 됐어요. 잠시 뒤 다시 해 주세요. (' + (err.code || err.message) + ')'; e.style.display = 'block'; $('#cxgo').disabled = false; }
  };
}

function find() {
  view.innerHTML = `<div class="wrap"><h2>내 여권 찾기</h2><div class="sub">신청할 때 넣은 이름과 휴대폰 번호를 넣어 주세요</div>
    <div class="field"><label>이름</label><input type="text" id="fn" maxlength="30"></div>
    <div class="field"><label>휴대폰 번호</label><input type="tel" id="fp" inputmode="numeric" maxlength="13" placeholder="01012345678"></div>
    <div class="err" id="fe"></div><button class="btn" id="fgo">찾기</button></div>`;
  $('#fgo').onclick = async () => {
    const e = $('#fe'); e.style.display = 'none';
    const key = await sha('lk|' + normName($('#fn').value) + '|' + digits($('#fp').value));
    try {
      const l = await getDoc(doc(db, 'lookups', key));
      if (!l.exists()) { e.textContent = '신청 기록을 찾지 못했어요. 이름과 번호를 다시 확인해 주세요.'; e.style.display = 'block'; return; }
      location.hash = '#/t/' + l.data().tok;
    } catch (err) { e.textContent = '잠시 문제가 생겼어요. 다시 눌러 주세요.'; e.style.display = 'block'; }
  };
}

/* ---------- boarding pass image ---------- */
function drawPass(d) {
  const W = 1080, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  x.fillStyle = '#E3F4EA'; x.fillRect(0, 0, W, H);
  x.save(); rr(40, 40, W - 80, H - 80, 36); x.clip(); x.fillStyle = '#fff'; x.fillRect(40, 40, W - 80, H - 80);
  x.fillStyle = '#1E5B3C'; x.fillRect(40, 40, W - 80, 96);
  x.restore();
  const F = (w, s, f) => `${w} ${s}px ${f || 'Pretendard, "Malgun Gothic", sans-serif'}`;
  x.fillStyle = '#C9A24A'; x.font = F(700, 30, 'ui-monospace, Consolas, monospace'); x.fillText('BOARDING PASS', 80, 100); x.textAlign = 'right'; x.fillText('G-DEAL AIR', W - 80, 100); x.textAlign = 'left';
  x.fillStyle = '#14402A'; x.font = F(800, 52); x.fillText(d.name + ' 선생님', 80, 210);
  x.font = F(700, 26); x.fillStyle = '#45AF76'; x.fillText(TYPE[d.type] + ' · 지딜 한마당 2026', 80, 255);
  x.fillStyle = '#14402A'; x.font = F(800, 96, 'ui-monospace, Consolas, monospace'); x.fillText('KOR', 80, 380); x.textAlign = 'right'; x.fillText('MSU', W - 80, 380); x.textAlign = 'center';
  x.fillStyle = '#45AF76'; x.font = F(700, 64); x.fillText('✈', W / 2, 370);
  x.fillStyle = '#5b7566'; x.font = F(500, 24); x.textAlign = 'left'; x.fillText('부울경·전국 어디서나', 82, 418); x.textAlign = 'right'; x.fillText('마산대학교', W - 82, 418);
  x.setLineDash([14, 12]); x.strokeStyle = '#cfe0d5'; x.lineWidth = 4; x.beginPath(); x.moveTo(80, 460); x.lineTo(W - 80, 460); x.stroke(); x.setLineDash([]);
  x.textAlign = 'left'; const cols = [['DATE', '12.19 SAT'], ['BOARDING', '10:00'], ['PASSPORT', d.pno]];
  cols.forEach(([k, v], i) => { const X = 80 + i * 320; x.fillStyle = '#5b7566'; x.font = F(600, 22); x.fillText(k, X, 510); x.fillStyle = '#14402A'; x.font = F(800, 38, 'ui-monospace, Consolas, monospace'); x.fillText(v, X, 556); });
  c.toBlob(b => {
    const url = URL.createObjectURL(b);
    if (/iPhone|iPad|Android/i.test(ua)) { modal(`<h2>탑승권 이미지</h2><div class="sub">이미지를 길게 눌러 사진에 저장하세요</div><img src="${url}" style="width:100%;border-radius:12px"><div class="gap"></div><button class="btn2" onclick="document.getElementById('modal').classList.remove('on')">닫기</button>`); }
    else { const a = document.createElement('a'); a.href = url; a.download = '지딜한마당_탑승권_' + d.pno + '.png'; a.click(); toast('이미지를 저장했어요'); }
  }, 'image/png');
}

/* ---------- router ---------- */
async function route() {
  clearInterval(timer);
  const h = location.hash.replace(/^#/, '') || '/';
  window.scrollTo(0, 0);
  if (h.startsWith('/test/')) { sessionStorage.setItem('hm_test', h.slice(6)); localStorage.removeItem('hm_tok'); location.hash = '#/'; return; }
  try {
    if (h.startsWith('/t/')) return ticket(h.slice(3));
    if (h === '/apply') return apply();
    if (h === '/find') return find();
    if (h === '/hack') return hack();
    return home();
  } catch (e) { console.error(e); view.innerHTML = `<div class="wrap"><div class="err" style="display:block">화면을 불러오지 못했어요. 새로고침해 주세요.</div></div>`; }
}
window.addEventListener('hashchange', route);
runIntro();
loadMeta().then(route).catch(e => { console.error(e); view.innerHTML = `<div class="wrap"><div class="err" style="display:block">연결이 원활하지 않아요. 잠시 뒤 새로고침해 주세요.</div></div>`; });
</script>
