<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제3회 지딜 한마당 · 초대장</title>
<meta name="description" content="2026.12.19(토) 마산대학교. 지딜 한마당에 선생님을 초대합니다.">
<meta property="og:title" content="제3회 지딜 한마당 · 선생님을 초대합니다">
<meta property="og:description" content="12월 19일 토요일 09:00–17:00 · 마산대학교 · 탑승 수속(참가 신청)은 여기서">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hanmadang.peace.re.kr/">
<meta property="og:image" content="https://hanmadang.peace.re.kr/og.png?v=4">
<meta name="theme-color" content="#1E5B3C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--g:#45AF76;--deep:#1E5B3C;--ink:#14402A;--mint:#E3F4EA;--cream:#FBF6E9;--gold:#C9A24A;--red:#D2493F;--blue:#2F6FD6;--purple:#7A4FD0;--orange:#E8892B;
--sans:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;--serif:"Gowun Batang","Noto Serif KR","Batang",serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
--paper:0 1px 0 rgba(20,64,42,.06),0 8px 24px rgba(20,64,42,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9F2EC}
body{font-family:var(--sans);color:var(--ink);line-height:1.6;font-size:15.5px;-webkit-font-smoothing:antialiased}
a{color:var(--deep)}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;
 background-image:repeating-radial-gradient(circle at 0 0,transparent 0 9px,rgba(69,175,118,.06) 9px 10px),repeating-radial-gradient(circle at 100% 100%,transparent 0 13px,rgba(201,162,74,.07) 13px 14px);box-shadow:0 0 40px rgba(20,64,42,.12)}
.bar{background:var(--deep);color:var(--gold);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:0;z-index:20}
.bar .t{font-family:var(--serif);letter-spacing:.18em;font-size:13px}
.bar svg{height:18px;width:auto}
.bar a{color:var(--gold);text-decoration:none}
.wrap{padding:18px 18px 40px}
h2{font-size:21px;font-weight:800;margin:6px 0 4px}
.sub{font-size:13px;color:#5b7566;margin-bottom:14px}
.btn{display:block;width:100%;text-align:center;background:var(--g);color:#fff;font-weight:800;border-radius:14px;padding:15px;font-size:16px;border:0;cursor:pointer;text-decoration:none;font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn2{display:block;width:100%;text-align:center;background:#fff;color:var(--deep);font-weight:800;border-radius:14px;padding:13px;font-size:15px;border:1.5px solid var(--g);cursor:pointer;text-decoration:none;font-family:inherit}
.btn3{background:none;border:0;color:#6b8577;font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit}
.gap{height:10px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;color:#fff;vertical-align:middle}
.pg{background:var(--g)}.pb{background:var(--blue)}.po{background:var(--orange)}.pr{background:var(--red)}.pd{background:#9aa9a0}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--paper);margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:6px}
.card p,.card li{font-size:14px;color:#3d5a4a}
.card ul{padding-left:18px}
.kv{display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:14px}
.kv b{color:#6b8577;font-weight:600}
/* invitation */
.hero{position:relative;padding:34px 18px 22px;background:linear-gradient(170deg,#1E5B3C 0%,#2b7a52 55%,#45AF76 100%);overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 85% 10%,transparent 0 22px,rgba(255,255,255,.05) 22px 23px);pointer-events:none}
.inv{position:relative;z-index:1;margin-top:26px;background:var(--cream);border-radius:6px;padding:30px 18px 20px;text-align:center;box-shadow:0 16px 34px rgba(0,0,0,.3)}
.inv::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);border-radius:3px;pointer-events:none}
.seal{position:absolute;top:-26px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fd09b,var(--g) 45%,#2c8a57);box-shadow:0 4px 10px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;font-size:21px}
.inv .to{font-family:var(--serif);font-size:14px;color:#6b5a2e}
.inv h1{font-family:var(--serif);font-size:28px;line-height:1.3;margin:6px 0 10px;color:var(--ink)}
.inv .meta{font-size:14px;color:#3d5a4a;margin-bottom:14px}
.phase{display:flex;gap:5px;margin:12px 0}
.phase div{flex:1;border-radius:9px;padding:7px 2px;font-size:11.5px;font-weight:700;background:#ece6d5;color:#857a5d;line-height:1.3}
.phase div small{display:block;font-weight:500;font-size:10px}
.phase .on{background:var(--g);color:#fff}
.phase .done{background:#dfe9e2;color:#8aa093}
.status{font-size:14px;font-weight:700;margin:4px 0}
.cd{display:flex;justify-content:center;gap:6px;margin:8px 0 6px}
.cd div{background:var(--deep);color:#fff;border-radius:8px;padding:6px 9px;font-family:var(--mono);font-size:18px;font-weight:700;line-height:1.1;min-width:50px}
.cd small{display:block;font-size:9.5px;font-weight:500;opacity:.8}
.seats{font-size:12.5px;color:#6b8577;margin-bottom:12px}
.from{font-size:11.5px;color:#7a6f52;margin-top:14px;line-height:1.5}
.notice{background:#FFF7E1;border:1.5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.kakao{background:#FEE500;color:#3c1e1e;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.kakao button{background:#3c1e1e;color:#FEE500;border:0;border-radius:99px;padding:7px 12px;font-weight:800;font-size:12.5px;white-space:nowrap;font-family:inherit}
/* form */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=password]{width:100%;border:1.5px solid #d3e2d8;border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(69,175,118,.18)}
.field .hint{font-size:12px;color:#6b8577;margin-top:4px}
.types{display:grid;gap:7px}
.types label{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #d3e2d8;border-radius:12px;padding:11px 12px;font-weight:700;font-size:14.5px;cursor:pointer}
.types label small{display:block;font-weight:500;font-size:12px;color:#6b8577}
.types input{width:18px;height:18px;accent-color:var(--g)}
.types label.dis{opacity:.45;cursor:not-allowed}
.consent{background:#fff;border-radius:12px;border:1.5px solid #d3e2d8;padding:12px;font-size:12.5px;color:#3d5a4a;margin-bottom:10px}
.consent b{color:var(--ink)}
.consent .chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:800;font-size:14px;color:var(--ink)}
.consent .chk input{width:20px;height:20px;accent-color:var(--g)}
.err{background:#FDECEA;color:#9b2c24;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0;display:none}
.ok{background:var(--mint);color:var(--deep);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
/* ticket */
.bp{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 30px rgba(20,64,42,.2);margin:6px 0 14px;position:relative}
.bp .hd{background:var(--deep);color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.18em;padding:10px 14px;display:flex;justify-content:space-between}
.bp .nm{padding:14px 16px 0;font-family:var(--serif);font-size:22px;font-weight:700}
.bp .route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px;text-align:center}
.bp .code{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1}
.bp .sm{font-size:11px;color:#5b7566}
.bp .ft{border-top:2px dashed #dfe9e2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 16px;font-size:10.5px;color:#5b7566;position:relative}
.bp .ft::before,.bp .ft::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--cream)}
.bp .ft::before{left:-9px}.bp .ft::after{right:-9px}
.bp .ft b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink)}
.bp .void{position:absolute;right:16px;top:52px;transform:rotate(-12deg);border:3px solid var(--red);color:var(--red);font-weight:900;padding:4px 12px;border-radius:8px;font-size:18px;opacity:.85}
.save{background:#FFF7E1;border:1.5px dashed var(--gold);border-radius:12px;padding:12px;font-size:13.5px;margin-bottom:12px}
.save b{display:block;font-size:14.5px;margin-bottom:4px}
.lnk{font-family:var(--mono);font-size:11.5px;word-break:break-all;background:#fff;border-radius:8px;padding:7px 9px;margin:6px 0;color:#3d5a4a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* intro */
.intro{position:fixed;inset:0;z-index:100;overflow:hidden;background:linear-gradient(180deg,#9fd8f5 0%,#d8f0fb 55%,#f3fbff 100%);transition:opacity .5s}
.intro.hide{opacity:0;pointer-events:none}
.intro .stage{position:absolute;left:50%;top:0;bottom:0;width:100%;max-width:480px;transform:translateX(-50%)}
.cloud{position:absolute;background:#fff;border-radius:99px;opacity:.9;animation:drift 9s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;top:-70%}.cloud::after{width:40%;height:130%;left:48%;top:-45%}
@keyframes drift{from{transform:translateX(520px)}to{transform:translateX(-220px)}}
.intro svg.trail{position:absolute;inset:0;width:100%;height:100%}
.intro svg.trail path{fill:none;stroke:#fff;stroke-width:.9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trail 2.3s ease-in forwards;filter:drop-shadow(0 0 3px rgba(255,255,255,.9))}
@keyframes trail{to{stroke-dashoffset:0}}
.intro .plane{position:absolute;left:0;top:0;width:64px;height:64px;animation:fly 2.3s ease-in forwards}
@keyframes fly{0%{transform:translate(-80px,78vh) rotate(-48deg) scale(.8)}100%{transform:translate(min(110vw,520px),-60px) rotate(-48deg) scale(1.2)}}
.intro .boong{position:absolute;left:0;right:0;top:38vh;text-align:center;font-family:var(--serif);font-weight:700;font-size:40px;color:var(--deep);opacity:0;animation:boong 1.6s .7s ease-out forwards}
@keyframes boong{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.1)}55%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.intro .tk{position:absolute;left:18px;right:18px;bottom:12vh;opacity:0;animation:tk .7s 2.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes tk{from{opacity:0;transform:translateY(120px)}to{opacity:1;transform:none}}
.intro .arrive{position:absolute;left:0;right:0;top:20vh;text-align:center;opacity:0;animation:tk .6s 2.4s ease-out forwards}
.intro .arrive b{display:block;font-family:var(--serif);font-size:25px;color:var(--ink)}
.intro .skip{position:absolute;right:16px;top:16px;font-size:13px;font-weight:700;color:var(--deep);background:rgba(255,255,255,.8);border-radius:99px;padding:6px 13px;border:0;z-index:3;font-family:inherit}
@media (prefers-reduced-motion:reduce){.intro{display:none}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,40,30,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:var(--cream);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px 26px}
.foot{font-size:12px;color:#6b8577;text-align:center;padding:20px 18px 34px;line-height:1.7}
.loading{text-align:center;padding:60px 0;color:#6b8577}
.photo{border-radius:12px;overflow:hidden;margin:8px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.dday{display:inline-block;background:var(--deep);color:#FFD54F;font-family:var(--mono);font-weight:700;font-size:13px;border-radius:99px;padding:4px 12px;margin-bottom:6px;letter-spacing:.04em}
.dday small{font-family:var(--sans);font-weight:600;color:#cfe8da;font-size:11px;margin-right:4px}
.ttw{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.ttr{display:flex;flex-direction:column;gap:6px;position:sticky;top:72px}
.ttr button{border:0;border-radius:12px;padding:8px 2px;background:var(--mint);color:var(--deep);cursor:pointer;font:inherit;line-height:1.25}
.ttr button b{display:block;font-family:var(--mono);font-size:15px}
.ttr button span{font-size:11.5px}
.ttr button.on{background:var(--deep);color:#fff}
.ttp .tph{font-family:var(--mono);font-weight:700;color:var(--deep);font-size:13px;margin:2px 0 8px}
.ttp .tph2{font-size:12px;font-weight:700;color:#6b8577;margin:12px 0 6px}
.ttp .tc{background:#F5FAF6;border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--g)}
.ttp .tc.fx{border-left-color:#c9d8ce;background:#FAFBFA}
.ttp .tc .nm{font-weight:800;font-size:15px;line-height:1.35}
.ttp .rm{display:inline-block;margin-top:5px;background:#fff;border:1.5px solid var(--g);color:var(--deep);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:800}
.ttp .tc.fx .rm{border-color:#c9d8ce}
.ttp .mt{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#6b8577}
.ttp .mt b{font-family:var(--mono);color:var(--deep);white-space:nowrap}
.ttp .mt b.full{color:var(--red)}
.ttp .tp1{background:#FFF7E1;border-left:4px solid var(--gold);border-radius:12px;padding:14px}
.ttp .tp1 .tm{font-family:var(--mono);font-weight:700;color:var(--deep);font-size:13px}
.ttp .tp1 .nm{font-weight:800;font-size:17px;margin:2px 0 4px}
.ttp .tp1 p{font-size:13px;color:#4a6355}
.tt2 .blk{border-left:4px solid var(--g);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tt2 .blk.all{border-left-color:var(--gold);background:#FFF7E1}
.tt2 .tm{font-family:var(--mono);font-weight:700;color:var(--deep);font-size:13px}
.tt2 .tt-t{font-weight:800;font-size:14.5px}
.tt2 .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px dashed #e3ece6}
.tt2 .row:first-of-type{border-top:0}
.tt2 .row small{color:#6b8577}
.tt2 .left{font-family:var(--mono);font-size:12px;white-space:nowrap;font-weight:700;color:var(--deep)}
.tt2 .left.full{color:var(--red)}
.ses{background:#fff;border:1.5px solid #e2ece5;border-radius:12px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ses.on{border-color:var(--blue);background:#EEF3FD}
.ses .nm2{font-weight:800;font-size:14px}
.ses small{display:block;font-size:11.5px;color:#6b8577}
.ses .act{white-space:nowrap}
.ses button{font-family:inherit;font-weight:800;font-size:12.5px;border-radius:99px;padding:6px 12px;cursor:pointer}
.ses .pick{background:var(--g);color:#fff;border:0}
.ses .swap{background:#fff;color:var(--deep);border:1.5px solid var(--g)}
.ses .drop{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.ses .tag2{font-size:11.5px;font-weight:800;color:#9aa9a0}
.grp{font-size:12.5px;font-weight:800;color:var(--blue);margin:10px 0 6px}
.lunch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lunch label{background:#fff;border:2px solid #e2ece5;border-radius:12px;overflow:hidden;cursor:pointer;display:block}
.lunch label.on{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,137,43,.15)}
.lunch img{width:100%;aspect-ratio:600/511;object-fit:cover;display:block;background:#eee}
.lunch span{display:block;font-size:12.5px;font-weight:800;padding:6px 8px}
.lunch input{display:none}
.lnone{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;font-weight:700}
.lnone input{width:18px;height:18px;accent-color:var(--orange)}
.kids{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700}
.kids input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
.kids select{font:inherit;border:1.5px solid #d3e2d8;border-radius:10px;padding:6px 10px}
.need{border:2px solid var(--orange)!important}
/* tabs + accordion */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--paper);margin-bottom:12px;position:sticky;top:51px;z-index:5}
.tabs button{font-family:inherit;font-weight:800;font-size:13.5px;border:0;background:none;color:#5b7566;border-radius:10px;padding:10px 2px;cursor:pointer}
.tabs button.on{background:var(--deep);color:#fff}
.tp[hidden]{display:none}
.herolink{display:block;text-align:center;font-size:12.5px;color:#5b7566;margin-top:10px;text-decoration:underline}
.acct{font-size:12.5px;font-weight:800;color:#6b8577;margin:14px 2px 6px;letter-spacing:.02em}
.acc{padding:0 16px!important;overflow:hidden}
.acc h3.acch{display:flex;align-items:center;gap:8px;margin:0 -16px!important;padding:15px 16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.acc .accs{margin-left:auto;font-size:12.5px;font-weight:700;color:#5b7566;text-align:right;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .accs .warn{color:#c4621a}
.acc .accs .okk{color:var(--deep)}
.acc .acci{flex:none;width:9px;height:9px;border-right:2.5px solid #8aa596;border-bottom:2.5px solid #8aa596;transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .2s}
.acc.open .acci{transform:rotate(-135deg);margin-top:4px}
.acc:not(.open) h3.acch ~ *{display:none!important}
.acc.open h3.acch ~ *:first-of-type{margin-top:0}
.acc.open{padding-bottom:14px!important}
#hackCard.acc{background:none;box-shadow:none;margin-bottom:12px;border-radius:16px}
#hackCard.acc:empty{display:none}
#hackCard.acc{padding:0!important}
#hackCard.acc .hk{padding:0 16px;margin:0}
#hackCard.acc.open .hk{padding:0 16px 14px}
#hackCard .accs,#hackCard .accs .okk{color:#fff}
#hackCard .acci{border-color:#fff}
.tfbox.acc h3.acch{padding:13px 16px}
.save .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.save .row3 .btn2{padding:10px 4px;font-size:13px;border-radius:11px}
.lunch img{aspect-ratio:16/9!important}
.sestog{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;font-family:inherit;font-weight:800;font-size:14px;background:#fff;border:1.5px solid #d3e2d8;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--deep)}
.sestog small{font-weight:700;color:#6b8577;font-size:12.5px;text-align:right}
.sestog.on small{color:var(--deep)}
#sesBody{margin-top:8px}
.sestog::after{content:'';width:8px;height:8px;border-right:2.5px solid #8aa596;border-bottom:2.5px solid #8aa596;transform:rotate(45deg);flex:none;margin:-4px 2px 0 4px}
.sestog small{margin-left:auto}
.sopt{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid #e2ece5;border-radius:11px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:14px}

/* ---------- seats + waitlist ---------- */
async function mySlots(tok) {
  const out = {};
  await Promise.all(SLOTKEYS.map(async k => { try { const s = await getDoc(doc(db, 'slots', tok + '_' + k)); if (s.exists()) out[k] = s.data().sid; } catch (e) { } }));
  return out;
}
async function myHold(tok, slots) {
  const st = {};
  await Promise.all([...new Set(Object.values(slots))].map(async sid => {
    const [a, b] = await Promise.all([getDoc(doc(db, 'seats', sid + '__' + tok)), getDoc(doc(db, 'waits', sid + '__' + tok))]);
    if (a.exists()) st[sid] = { seat: true }; else if (b.exists()) st[sid] = { n: b.data().n };
  }));
  return st;
}
const sRef = sid => doc(db, 'sessions', sid);
async function trySes(sid, fn) { try { await runTransaction(db, async tx => { const x = (await tx.get(sRef(sid))).data(); const u = fn(x); if (!u) throw new Error('STALE'); tx.update(sRef(sid), u); }); return true; } catch (e) { return false; } }
// 대기줄 정리: 그만둔 번호 건너뛰기, 빈자리 있으면 대기 1번 올리기
async function settle(sid) {
  let s;
  for (let i = 0; i < 60; i++) {
    s = (await getDoc(sRef(sid))).data();
    if ((s.wh || 0) >= (s.wq || 0)) return s;
    const wh = s.wh;
    if (s.count < s.cap && await trySes(sid, x => x.wh === wh && x.count < x.cap ? { count: x.count + 1, wh: wh + 1 } : null)) continue;
    if (await trySes(sid, x => x.wh === wh ? { wh: wh + 1 } : null)) continue;
    const s2 = (await getDoc(sRef(sid))).data(); if (s2.wh === wh) return s2;
  }
  return s;
}
async function reserveSeat(tok, sid) {
  await runTransaction(db, async tx => {
    const sd = (await tx.get(sRef(sid))).data();
    if (sd.count >= sd.cap || (sd.wh || 0) < (sd.wq || 0)) throw new Error('FULL');
    tx.set(doc(db, 'seats', sid + '__' + tok), { sid, tok, at: serverTimestamp() });
    tx.update(sRef(sid), { count: sd.count + 1, last: mark(tx, tok) });
    for (const k of sd.slots) tx.set(doc(db, 'slots', tok + '_' + k), { sid, tok, k });
  });
}
async function joinWait(tok, sid) {
  await runTransaction(db, async tx => {
    const sd = (await tx.get(sRef(sid))).data();
    const wq = sd.wq || 0;
    if (!(sd.count >= sd.cap || (sd.wh || 0) < wq)) throw new Error('ROOM');
    tx.set(doc(db, 'waits', sid + '__' + tok), { sid, tok, n: wq, at: serverTimestamp() });
    tx.set(doc(db, 'wq', sid + '_' + wq), { sid, n: wq, tok });
    tx.update(sRef(sid), { wq: wq + 1 });
    for (const k of sd.slots) tx.set(doc(db, 'slots', tok + '_' + k), { sid, tok, k, w: true });
  });
}
// 좌석·대기 놓기. 확정 자리를 놓으면 대기 1번이 자동으로 확정됨
async function releaseSeat(tok, sid) {
  let err;
  for (let a = 0; a < 4; a++) {
    await settle(sid);
    try {
      await runTransaction(db, async tx => {
        const s = (await tx.get(sRef(sid))).data();
        const seRef = doc(db, 'seats', sid + '__' + tok), wRef = doc(db, 'waits', sid + '__' + tok);
        const se = await tx.get(seRef), w = await tx.get(wRef);
        const sl = []; for (const k of s.slots) { const r = doc(db, 'slots', tok + '_' + k); if ((await tx.get(r)).exists()) sl.push(r); }
        if (!se.exists() && !w.exists()) return;
        const holder = se.exists() || w.data().n < (s.wh || 0);
        tx.delete(se.exists() ? seRef : wRef);
        sl.forEach(r => tx.delete(r));
        if (!holder) return;
        const m = mark(tx, tok);
        if ((s.wh || 0) < (s.wq || 0)) tx.update(sRef(sid), { wh: s.wh + 1, last: m });
        else tx.update(sRef(sid), { count: s.count - 1, last: m });
      });
      return;
    } catch (e) { err = e; }
  }
  throw err;
}

// 해커톤 취소 쓰기 (트랜잭션 안에서, 읽기는 미리)
async function hackReads(tx, tok) {
  const hRef = doc(db, 'hackers', tok), hcRef = doc(db, 'hcounters', 'main');
  const h = await tx.get(hRef); if (!h.exists() || h.data().status !== 'active') return null;
  const hc = (await tx.get(hcRef)).data();
  let tRef = null, t = null;
  if (h.data().team) { tRef = doc(db, 'teams', h.data().team); const s = await tx.get(tRef); t = s.exists() ? s.data() : null; }
  return { hRef, hcRef, h: h.data(), hc, tRef, t };
}
function hackWrites(tx, tok, r, phone) {
  const v = rnd(20, AL);
  tx.update(r.hRef, { status: 'cancelled', cancelledAt: serverTimestamp(), cancelPhone: phone, v });
  tx.update(r.hcRef, { total: r.hc.total - 1, last: mark(tx, tok) });
  if (r.tRef && r.t) { tx.set(doc(db, 'hjoins', v), { tok, team: r.h.team, kind: 'leave' }); tx.update(r.tRef, { count: r.t.count - 1, names: r.t.names.filter(n => n !== r.h.name), v }); }
}
function hackCancelFlow(tok, d) {
  modal(`<h2>해커톤 신청을 취소할까요?</h2><div class="sub">한마당 참가는 그대로 유지돼요. 확인을 위해 휴대폰 번호 전체를 넣어 주세요.</div>
    <div class="field"><input type="tel" id="hxp" inputmode="numeric" placeholder="01012345678"></div><div class="err" id="hxe"></div>
    <button class="btn" id="hxgo" style="background:var(--red)">해커톤 취소하기</button><div class="gap"></div><button class="btn2" id="hxno">그대로 둘게요</button>`);
  $('#hxno').onclick = closeModal;
  $('#hxgo').onclick = async () => {
    const ph = digits($('#hxp').value), e = $('#hxe'); e.style.display = 'none';
    if (ph !== d.phone) { e.textContent = '신청한 휴대폰 번호와 달라요.'; e.style.display = 'block'; return; }
    $('#hxgo').disabled = true;
    try {
      await runTransaction(db, async tx => { const r = await hackReads(tx, tok); if (!r) throw new Error('NONE'); hackWrites(tx, tok, r, ph); });
      closeModal(); toast('해커톤 신청을 취소했어요'); ticket(tok);
    } catch (err) { console.error(err); e.textContent = '취소가 안 됐어요. (' + (err.code || err.message) + ')'; e.style.display = 'block'; $('#hxgo').disabled = false; }
  };
}

function cancelFlow(tok, d) {
  modal(`<h2>참가를 취소할까요?</h2><div class="sub">취소하면 자리가 다른 선생님께 돌아가요. 해커톤을 신청했다면 그것도 함께 취소돼요. 확인을 위해 신청한 휴대폰 번호 전체를 넣어 주세요.</div>
    <div class="field"><input type="tel" id="cxp" inputmode="numeric" placeholder="01012345678"></div><div class="err" id="cxe"></div>
    <button class="btn" id="cxgo" style="background:var(--red)">참가 취소하기</button><div class="gap"></div><button class="btn2" id="cxno">그대로 둘게요</button>`);
  $('#cxno').onclick = closeModal;
  $('#cxgo').onclick = async () => {
    const ph = digits($('#cxp').value);
    const e = $('#cxe'); e.style.display = 'none';
    if (ph !== d.phone) { e.textContent = '신청한 휴대폰 번호와 달라요.'; e.style.display = 'block'; return; }
    $('#cxgo').disabled = true;
    try {
      const ms = await mySlots(tok); for (const sid of new Set(Object.values(ms))) await releaseSeat(tok, sid);
      await runTransaction(db, async tx => {
        const cRef = doc(db, 'counters', 'main'); const pRef = doc(db, 'participants', tok);
        const c = await tx.get(cRef); const p = await tx.get(pRef);
        const hr = await hackReads(tx, tok);
        if (p.data().status !== 'active') throw new Error('ALREADY');
        const cd = c.data(), t = p.data().type;
        if (hr) hackWrites(tx, tok, hr, ph);
        tx.update(pRef, { status: 'cancelled', cancelledAt: serverTimestamp(), cancelPhone: ph });
        tx.update(cRef, { total: cd.total - 1, [t]: (cd[t] || 1) - 1, last: mark(tx, tok) });
        tx.delete(doc(db, 'phones', p.data().phoneKey));
      });
      closeModal(); toast('취소했어요'); await loadMeta(); ticket(tok);
    } catch (err) { console.error(err); e.textContent = '취소가 안 됐어요. 잠시 뒤 다시 해 주세요. (' + (err.code || err.message) + ')'; e.style.display = 'block'; $('#cxgo').disabled = false; }
  };
}

      const l = await getDoc(doc(db, 'lookups', key));
      if (!l.exists()) { e.textContent = '신청 기록을 찾지 못했어요. 이름과 번호를 다시 확인해 주세요.'; e.style.display = 'block'; return; }
      location.hash = '#/t/' + l.data().tok;
    } catch (err) { e.textContent = '잠시 문제가 생겼어요. 다시 눌러 주세요.'; e.style.display = 'block'; }
  };
}

/* ---------- boarding pass image ---------- */
function drawPass(d) {
  const W = 1080, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); };
  x.fillStyle = '#E3F4EA'; x.fillRect(0, 0, W, H);
  x.save(); rr(40, 40, W - 80, H - 80, 36); x.clip(); x.fillStyle = '#fff'; x.fillRect(40, 40, W - 80, H - 80);
  x.fillStyle = '#1E5B3C'; x.fillRect(40, 40, W - 80, 96);
  x.restore();
  const F = (w, s, f) => `${w} ${s}px ${f || 'Pretendard, "Malgun Gothic", sans-serif'}`;
  x.fillStyle = '#C9A24A'; x.font = F(700, 30, 'ui-monospace, Consolas, monospace'); x.fillText('BOARDING PASS', 80, 100); x.textAlign = 'right'; x.fillText('G-DEAL AIR', W - 80, 100); x.textAlign = 'left';
  x.fillStyle = '#14402A'; x.font = F(800, 52); x.fillText(d.name + ' 선생님', 80, 210);
  x.font = F(700, 26); x.fillStyle = '#45AF76'; x.fillText(TYPE[d.type] + ' · 지딜 한마당 2026', 80, 255);
  x.fillStyle = '#14402A'; x.font = F(800, 96, 'ui-monospace, Consolas, monospace'); x.fillText('KOR', 80, 380); x.textAlign = 'right'; x.fillText('MSU', W - 80, 380); x.textAlign = 'center';
  x.fillStyle = '#45AF76'; x.font = F(700, 64); x.fillText('✈', W / 2, 370);
  x.fillStyle = '#5b7566'; x.font = F(500, 24); x.textAlign = 'left'; x.fillText('부울경·전국 어디서나', 82, 418); x.textAlign = 'right'; x.fillText('마산대학교', W - 82, 418);
  x.setLineDash([14, 12]); x.strokeStyle = '#cfe0d5'; x.lineWidth = 4; x.beginPath(); x.moveTo(80, 460); x.lineTo(W - 80, 460); x.stroke(); x.setLineDash([]);
  x.textAlign = 'left'; const cols = [['DATE', '12.19 SAT'], ['BOARDING', '09:00'], ['PASSPORT', d.pno]];
  cols.forEach(([k, v], i) => { const X = 80 + i * 320; x.fillStyle = '#5b7566'; x.font = F(600, 22); x.fillText(k, X, 510); x.fillStyle = '#14402A'; x.font = F(800, 38, 'ui-monospace, Consolas, monospace'); x.fillText(v, X, 556); });
  c.toBlob(b => {
    const url = URL.createObjectURL(b);
    if (/iPhone|iPad|Android/i.test(ua)) { modal(`<h2>탑승권 이미지</h2><div class="sub">이미지를 길게 눌러 사진에 저장하세요</div><img src="${url}" style="width:100%;border-radius:12px"><div class="gap"></div><button class="btn2" onclick="document.getElementById('modal').classList.remove('on')">닫기</button>`); }
    else { const a = document.createElement('a'); a.href = url; a.download = '지딜한마당_탑승권_' + d.pno + '.png'; a.click(); toast('이미지를 저장했어요'); }
  }, 'image/png');
}

/* ---------- router ---------- */
async function route() {
  clearInterval(timer);
  tfUnsub.forEach(f => f()); tfUnsub = [];
  const h = location.hash.replace(/^#/, '') || '/';
  window.scrollTo(0, 0);
  if (h.startsWith('/test/')) { sessionStorage.setItem('hm_test', h.slice(6)); sessionStorage.removeItem('hm_staff'); localStorage.removeItem('hm_tok'); location.hash = '#/'; return; }
  if (h.startsWith('/tf/')) {
    if (!staffOpen()) { view.innerHTML = `<div class="wrap"><h2>TF 사전 접수가 끝났어요</h2><div class="card"><p>지금은 정식 접수 기간이에요. 초대장에서 신청해 주세요.</p></div><a class="btn" href="#/">초대장으로</a></div>`; return; }
    sessionStorage.setItem('hm_staff', h.slice(4)); sessionStorage.removeItem('hm_test'); location.hash = '#/'; return;
  }
  try {
    if (h.startsWith('/t/')) return ticket(h.slice(3));
    if (h === '/apply') return apply();
    if (h === '/find') return find();
    if (h === '/hack') return hack();
    return home();
  } catch (e) { console.error(e); view.innerHTML = `<div class="wrap"><div class="err" style="display:block">화면을 불러오지 못했어요. 새로고침해 주세요.</div></div>`; }
}
window.addEventListener('hashchange', route);
runIntro();
loadMeta().catch(e => { console.error(e); }).then(() => route()).catch(e => { console.error(e); view.innerHTML = `<div class="wrap"><div class="err" style="display:block">연결이 원활하지 않아요. 잠시 뒤 새로고침해 주세요.</div></div>`; });
</script>
